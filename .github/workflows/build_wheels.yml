# Placeholder for once rust/ contains a real PyO3 extension (see
# rust/Cargo.toml). Not wired up yet -- there's nothing to build until
# the crate exists and dem_relief.blend imports it. Left here so the
# CI path is obvious when that day comes; delete the `if: false` guard
# and fill in the maturin build steps at that point.
#
name: build-wheels

on:
  push:
    tags: ["v*"]

jobs:
  build:
    if: false  # remove once rust/ has a real crate to build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m rust/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist