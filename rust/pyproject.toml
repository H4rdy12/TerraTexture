[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "terra-texture-rs"
version = "0.1.0"
description = "Compiled Rust extension for TerraTexture: pyo3/numpy/ndarray-backed elementwise blend and derivatives math."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Dominic Hardy" },
]
dynamic = ["classifiers"]
 
[project.urls]
Homepage = "https://github.com/H4rdy12/TerraTexture"
Repository = "https://github.com/H4rdy12/TerraTexture"
Issues = "https://github.com/H4rdy12/TerraTexture/issues"

[tool.maturin]
module-name = "terra_texture_rs"
