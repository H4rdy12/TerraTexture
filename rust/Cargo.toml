[package]
name = "terra_texture_rs"
version = "0.1.0"
edition = "2021"
description = "Compiled Rust extension for TerraTexture: pyo3/numpy/ndarray-backed elementwise blend and derivatives math (soft-light / luminosity blending, curvature derivatives). Used as an optional accelerated backend, with terra_texture.blend/derivatives falling back to pure numpy when it isn't built."
license = "MIT"
authors = ["Dominic Hardy"]
repository = "https://github.com/H4rdy12/TerraTexture"
homepage = "https://github.com/H4rdy12/TerraTexture"

[lib]
name = "terra_texture_rs"
# "cdylib" is what makes this importable from Python (via maturin).
# "rlib" is added alongside it so `cargo bench`/`cargo test` can link
# against the crate's pure-Rust functions directly, without going
# through Python/PyO3 at all -- see benches/blend_bench.rs, which tunes
# PARALLEL_THRESHOLD in src/lib.rs against real measurements instead of
# a guessed constant.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.22"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "blend_bench"
harness = false

# Build with `maturin develop` (from the rust/ directory, with a venv
# active) to get an importable `terra_texture_rs` module -- this is what
# src/terra_texture/blend.py tries to import, falling back to pure numpy
# if it's not built. See README.md's package-layout table:
# terra_texture.blend and terra_texture.derivatives are the pure-numpy
# modules targeted here, since they have zero geospatial dependencies
# and are the actual elementwise-math hot path.
#
# Run `cargo bench` to tune PARALLEL_THRESHOLD in src/lib.rs -- it's
# currently a provisional placeholder, not a measured value (see the
# TODO comment next to its definition).
