[package]
name = "dem_relief_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "dem_relief_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1"

# Build with `maturin develop` (from the rust/ directory, with a venv
# active) to get an importable `dem_relief_rs` module. Not wired into
# dem_relief.blend yet -- this crate is a starting point, not a finished
# accelerated implementation. See README.md's package-layout table:
# dem_relief.blend and dem_relief.derivatives are the pure-numpy modules
# to target here, since they have zero geospatial dependencies and are
# the actual elementwise-math hot path.
