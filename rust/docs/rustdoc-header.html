<!--
TerraTexture rustdoc theme -- the Rust-side mirror of the pdoc theme
(layout.css + content.css + theme.css).
 
Injected into every rustdoc page via `--html-in-header` (see
.cargo/config.toml). Colours sampled from the project logo:
  brand blue  #244459  ("erra")
  brand green #135821  ("Texture")
 
Same colour roles as pdoc: names (modules, functions) in brand blue;
types, traits and keywords in brand green -- pdoc's --def/--annotation.
 
rustdoc ships light/dark/ayu themes on `:root[data-theme=...]`. The
`html:root` selectors below are one notch more specific, so this palette
applies whichever theme a reader has picked, matching the light-only
pdoc docs.
 
The contour background is NOT written by hand here: it is copied from
pdoc's layout.css by docs/sync_rustdoc_contour.py, so both doc sites
share one texture. Re-run that script whenever the contour is
regenerated.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap">
<script>
    /*
    Logo -> TerraTexture docs landing page (mirrors the pdoc logo, which
    links to ../index.html).
     
    rustdoc has no option for where the logo links: it always points at the
    crate's own front page. In the deployed site the rustdoc root is
    site/rust/, so the landing page (site/index.html) is one level above it.
    rustdoc records each page's relative path back to its root in
    <meta name="rustdoc-vars" data-root-path="../../">, which makes the
    landing page root-path + "../index.html" at any depth. If that attribute
    is ever missing, fall back to two levels up from the logo's own href
    (<root>/terra_texture_rs/index.html -> <root>/../index.html).
     
    Only resolves when the docs sit inside the full site (CI, or
    `python docs/build_docs.py --rust`); a bare `cargo doc` has no landing
    page above target/doc/.
    */
    document.addEventListener("DOMContentLoaded", function () {
        var vars = document.querySelector('meta[name="rustdoc-vars"]');
        var rootPath = vars ? vars.getAttribute("data-root-path") : null;
        var logos = document.querySelectorAll("a.logo-container, a.sub-logo-container");
        logos.forEach(function (link) {
            var landing = rootPath !== null
                ? new URL(rootPath + "../index.html", document.baseURI)
                : new URL("../../index.html", link.href);
            link.href = landing.href;
            link.title = "TerraTexture docs home";
        });
    });
    </script>
<style>
/* ======================================================================
   Palette (theme.css) mapped onto rustdoc's variables
   ====================================================================== */
html:root[data-theme],
html:root:not([data-theme]) {
    color-scheme: light;
 
    /* pdoc names, kept for use in the rules below */
    --tt-text: #22262a;
    --tt-muted: #696969;
    --tt-link: #244459;
    --tt-link-hover: #3d6683;
    --tt-code: #f4f5f2;
    --tt-accent: rgba(36, 68, 89, 0.06);
    --tt-accent2: #d7dad3;
    --tt-active: rgba(36, 68, 89, 0.12);
    --tt-nav-hover: rgba(36, 68, 89, 0.08);
    --tt-def: #135821;
 
    /* page + text */
    --main-background-color: #eef0ed;
    --main-color: var(--tt-text);
    --right-side-color: var(--tt-muted);
    --search-results-grey-color: var(--tt-muted);
    --toggles-color: var(--tt-muted);
    --src-line-numbers-span-color: var(--tt-muted);
 
    /* links: names blue, types/keywords green */
    --link-color: var(--tt-link);
    --mod-link-color: var(--tt-link);
    --function-link-color: var(--tt-link);
    --assoc-item-link-color: var(--tt-link);
    --type-link-color: var(--tt-def);
    --trait-link-color: var(--tt-def);
    --macro-link-color: var(--tt-def);
    --keyword-link-color: var(--tt-def);
 
    /* sidebar */
    --sidebar-background-color: rgba(248, 249, 246, 0.45);
    --sidebar-background-color-hover: var(--tt-nav-hover);
    --sidebar-current-link-background-color: var(--tt-active);
    --sidebar-link-color: var(--tt-muted);
    --src-sidebar-background-selected: var(--tt-active);
    --src-sidebar-background-hover: var(--tt-nav-hover);
 
    /* borders, code, inputs */
    --border-color: var(--tt-accent2);
    --headings-border-bottom-color: var(--tt-accent2);
    --table-alt-row-background-color: transparent;
    --code-block-background-color: var(--tt-code);
    --button-background-color: transparent;
    --settings-input-color: var(--tt-link);
    --settings-input-border-color: var(--tt-accent2);
    --search-input-focused-border-color: var(--tt-link);
    --search-result-border-color: var(--tt-accent2);
    --search-result-link-focus-background-color: var(--tt-active);
    --target-background-color: var(--tt-active);
    --target-border-color: var(--tt-link);
    --scrollbar-track-background-color: transparent;
    --scrollbar-thumb-background-color: var(--tt-accent2);
    --scrollbar-color: var(--tt-accent2) transparent;
 
    /* syntax highlighting in examples */
    --code-highlight-kw-color: var(--tt-def);
    --code-highlight-kw-2-color: var(--tt-def);
    --code-highlight-self-color: var(--tt-def);
    --code-highlight-macro-color: var(--tt-def);
    --code-highlight-question-mark-color: var(--tt-def);
    --code-highlight-lifetime-color: var(--tt-link);
    --code-highlight-prelude-color: var(--tt-link);
    --code-highlight-prelude-val-color: var(--tt-link);
    --code-highlight-number-color: var(--tt-link-hover);
    --code-highlight-literal-color: var(--tt-link-hover);
    --code-highlight-string-color: #6b7a2e;
    --code-highlight-attribute-color: var(--tt-muted);
    --code-highlight-comment-color: var(--tt-muted);
    --code-highlight-doc-comment-color: #5b6b5e;
 
    /* icons are dark-on-light in this palette */
    --copy-path-img-filter: none;
    --copy-path-img-hover-filter: none;
    --crate-search-div-filter: none;
    --toggle-filter: none;
    --rust-logo-filter: none;
}

html, main {
    scroll-behavior: smooth;
}
 
/* Main content: translucent box over the contours (layout.css: main.pdoc) */
html:root main {
    background-color: rgba(238, 240, 237, 0.45);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
}
 
/* ======================================================================
   Sidebar (layout.css: nav.pdoc)
   ====================================================================== */
html:root .sidebar {
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    border-right: 1px solid var(--tt-accent2);
    scrollbar-width: thin;
}
 
html:root .sidebar a {
    border-radius: 4px;
    font-size: 0.875rem;
    transition: color 100ms, background-color 100ms;
}
 
html:root .sidebar a:hover {
    color: var(--tt-link-hover);
    background-color: var(--tt-nav-hover);
    text-decoration: none;
}
 
/* crate name at the top of the sidebar */
html:root .sidebar-crate h2 a {
    color: var(--tt-text);
    font-weight: 500;
    font-size: 1rem;
}
 
/* sidebar section headings: small uppercase mono (layout.css: nav h2) */
html:root .sidebar h2:not(.location):not(.sidebar-crate h2),
html:root .sidebar h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--tt-muted);
}
 
html:root .sidebar h2.location a {
    color: var(--tt-text);
    font-weight: 500;
}
 
/* ======================================================================
   Headings (content.css: h1-h5, .modulename)
   ====================================================================== */
html:root h1, html:root h2, html:root h3, html:root h4 {
    font-family: 'DM Sans', 'Fira Sans', sans-serif;
    font-weight: 500;
    color: var(--tt-text);
    letter-spacing: -0.01em;
}
 
html:root .main-heading h1 {
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.02em;
}
 
html:root .main-heading h1 a {
    color: var(--tt-link);
    transition: color 120ms;
}
 
html:root .main-heading h1 a:hover {
    color: var(--tt-link-hover);
}
 
/* ======================================================================
   Links (content.css: a)
   ====================================================================== */
html:root .docblock a:not(.test-arrow):not(.doc-anchor),
html:root .docblock-short a,
html:root .item-table a {
    text-decoration: none;
    transition: color 120ms;
}
 
html:root .docblock a:not(.test-arrow):hover,
html:root .docblock-short a:hover,
html:root .item-table a:hover {
    color: var(--tt-link-hover);
}
 
/* ======================================================================
   Docstrings (content.css: .docstring)
   ====================================================================== */
html:root .docblock,
html:root .docblock-short {
    color: var(--tt-muted);
    line-height: 1.75;
}
 
html:root .docblock strong {
    color: var(--tt-text);
    font-weight: 500;
}
 
/* ======================================================================
   Code (content.css: code, pre)
   ====================================================================== */
code, pre, a.test-arrow, .code-header {
    font-family: 'JetBrains Mono', 'Source Code Pro', monospace;
}
 
/* inline code chips */
html:root .docblock :not(pre) > code,
html:root .docblock-short code {
    color: var(--tt-link);
    background-color: var(--tt-nav-hover);
    padding: 0.2em 0.4em;
    border-radius: 4px;
    font-size: 85%;
}
 
html:root .docblock a > code,
html:root .docblock-short a > code {
    color: inherit;
}
 
/* code blocks */
html:root .docblock .example-wrap pre {
    background-color: var(--tt-code);
    border: 1px solid var(--tt-accent2);
    border-radius: 8px;
    padding: 0.75rem;
    color: var(--tt-text);
}
 
/* item signatures get pdoc's attribute box (content.css: .attr) */
html:root pre.item-decl {
    background-color: rgba(36, 68, 89, 0.05);
    border: 1px solid var(--tt-accent2);
    border-radius: 8px;
    padding: 0.5rem 0.75rem 0.5rem 1rem;
    transition: border-color 150ms;
}
 
html:root pre.item-decl:hover {
    border-color: var(--tt-link);
}
 
/* item names in module listings (content.css: .name) */
html:root .item-table .item-name a,
html:root .item-table dt a {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
}
 
/* ======================================================================
   Tables (content.css: table)
